<body>

<section class="container">
<div class="contact-form">
<h2 style="text-align: center; margin-bottom: 30px; margin-top: 0; color: var(--primary-blue);">Submit Your Project Details</h2>
<form action="#" method="POST">
<div class="form-group">
<label for="name">Business or Full Name</label>
<input type="text" id="name" name="name" required>
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" required>
</div>
<div class="form-group">
<label for="message">How can we help your business grow?</label>
<textarea id="message" name="message" rows="5" required></textarea>
</div>
<button type="submit" class="btn" style="width: 100%;">Send Request</button>
</form>
</div>
</section>
<footer>
<h2 style="color: var(--accent-cyan); margin-top: 0;">Connect With Us</h2>
<div class="social-links">
<a href="https://www.facebook.com/profile.php?id=61593640116732" target="_blank">Facebook</a>
<a href="https://www.instagram.com/my_websitecreations/" target="_blank">Instagram</a>
</div>
<p>Email: <a href="mailto:your-email@example.com" style="color: var(--white); text-decoration: none;">your-email@example.com</a></p>
</footer>
</body>
</html>
